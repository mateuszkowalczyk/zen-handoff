name: Task request
description: Submit an idea or task; held in triage until you approve it.
labels: ["status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        This request starts in **triage**. The primary agent will not act on it until a human replaces `status:triage` with `status:ready`.
        Do not include secrets or sensitive production data.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should change, and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: How will we know the result is correct?
  - type: textarea
    id: context
    attributes:
      label: Context and constraints
      description: Relevant background, links, scope limits, or decisions needed.
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: >-
        Issues that must be completed first (for example, "Blocked by #123"), or None.
        The primary agent will record the native GitHub relationships after approval.
